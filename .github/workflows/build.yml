name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    name: Unity ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: unity/NPPControlRoom/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('unity/NPPControlRoom/Packages/packages-lock.json', 'unity/NPPControlRoom/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/NPPControlRoom
          targetPlatform: ${{ matrix.targetPlatform }}
          allowDirtyBuild: true

      - uses: actions/upload-artifact@v4
        with:
          name: NPP-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: 14
